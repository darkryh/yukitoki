#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Allow the Compose Multiplatform sample's Android *application* target to combine the
# com.android.application plugin with the Kotlin Multiplatform plugin under AGP 9.
android.builtInKotlin=false
android.newDsl=false

#Kotlin Multiplatform
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
